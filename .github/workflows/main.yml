name: Build RootlessAndroid15VM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    - name: Install NDK and CMake
      run: |
        sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    # Вместо chmod устаревшего gradlew, используем предустановленный gradle для сборки проекта
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: rootless-vm-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

  build-cli:
    name: Build Standalone CLI Runner
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-aarch64-linux-gnu cmake

    - name: Grant Execute Permission for CLI Script
      run: chmod +x build_cli.sh

    - name: Compile CLI Binary
      run: |
        sed -i 's/g++/aarch64-linux-gnu-g++/g' build_cli.sh
        ./build_cli.sh

    - name: Upload CLI Binary
      uses: actions/upload-artifact@v4
      with:
        name: vm-cli-runner
        path: vm_cli_runner
        
