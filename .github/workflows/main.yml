name: Build RootlessAndroid15VM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''

    # Явно ставим NDK 26, который запрашивает Gradle проекта, чтобы избежать конфликтов версий
    - name: Install NDK and CMake
      run: |
        sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

    # Исправляем конфликт с memfd_create для современных NDK r26+
    # Мы просто комментируем строки, где проект пытается объявить системную функцию вручную
    - name: Patch Source Code Bugs
      run: |
        sed -i 's/int memfd_create(const char \*name, unsigned int flags);/\/\/ Системная функция уже есть в NDK r26/g' engine/ipc/virtual_binder.cpp
        sed -i 's/int fd = syscall(__NR_memfd_create/\/\/ int fd = syscall(__NR_memfd_create/g' engine/ipc/virtual_binder.cpp

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: rootless-vm-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

  build-cli:
    name: Build Standalone CLI Runner
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-aarch64-linux-gnu cmake

    - name: Grant Execute Permission for CLI Script
      run: chmod +x build_cli.sh

    - name: Compile CLI Binary
      run: |
        sed -i 's/g++/aarch64-linux-gnu-g++/g' build_cli.sh
        ./build_cli.sh

    - name: Upload CLI Binary
      uses: actions/upload-artifact@v4
      with:
        name: vm-cli-runner
        path: vm_cli_runner
        
