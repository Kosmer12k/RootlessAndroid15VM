name: RootlessAndroid15VM Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        # Устанавливаем NDK, так как проект активно использует CMake для сборки libvm_engine.so
        ndk-version: '27.0.12077973' 

    - name: Grant Execute Permission for Scripts
      run: |
        chmod +x gradlew
        chmod +x build_cli.sh

    - name: Build Android App (APK & Native .so)
      run: ./gradlew assembleDebug

    - name: Build Standalone CLI Test Runner
      # Эмулируем окружение для локального скрипта компиляции CLI
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973
        ./build_cli.sh
      continue-on-error: true # Скрипт CLI опционален, если он завязан на Termux-окружение

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RootlessVM-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Upload CLI Runner (If compiled)
      uses: actions/upload-artifact@v4
      with:
        name: vm_cli_runner
        path: ./vm_cli_runner
        retention-days: 14
        if-no-files-found: ignore
        
